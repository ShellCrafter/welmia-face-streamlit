name: Keep Streamlit Awake
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping app
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 180 \
            --max-redirs 5 \
            -L \
            -H "User-Agent: KeepAlive/1.0" \
            https://welmia-face.streamlit.app/)
          CURL_EXIT=$?
          echo "HTTP Status: $HTTP_CODE"
          echo "Curl exit: $CURL_EXIT"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Awake"
          elif [ "$HTTP_CODE" = "302" ] || [ "$HTTP_CODE" = "301" ]; then
            echo "✅ Awake (redirect — normal for Streamlit)"
          elif [ "$HTTP_CODE" = "503" ]; then
            echo "⏳ Waking up"
          elif [ "$CURL_EXIT" = "47" ]; then
            echo "✅ Awake (redirect loop during warm-up — app is responding)"
          else
            echo "❌ Unexpected: HTTP=$HTTP_CODE curl_exit=$CURL_EXIT"
            exit 1
          fi
