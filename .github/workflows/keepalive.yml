name: Keep Streamlit Awake
on:
  schedule:
    - cron: '0 */4 * * *'   # Every 4 hours — safe margin under 12h sleep threshold
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping app
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 180 \
            -L \
            -H "User-Agent: KeepAlive/1.0" \
            https://welmia-face.streamlit.app/)
          echo "Status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Awake"
          elif [ "$HTTP_CODE" = "503" ]; then
            echo "⏳ Waking up"
          else
            echo "❌ Unexpected: $HTTP_CODE"
            exit 1
          fi
